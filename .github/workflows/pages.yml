name: Pages

# The whole site is built here and published to gh-pages, which Pages serves from its root folder:
#
#     /                     the hub, the legal notice, the privacy policy, the contact page
#     /jwt/4.3/             a version, built from projects/jwt/4.3/
#     /jwt/latest/          a copy of the newest version
#     /jwt/versions.json    what the version selector of that project reads
#
# One repository, one build, one branch. Nothing else writes gh-pages.
on:
    push:
        branches:
            - main
        paths-ignore:
            - '.github/workflows/check.yml'
    workflow_dispatch:

env:
    NO_MKDOCS_2_WARNING: 'true'
    DISABLE_MKDOCS_2_WARNING: 'true'

permissions:
    contents: write

concurrency:
    group: gh-pages
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        steps:
            # The whole history: the revision date of a page is read from it.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: requirements.txt

            - name: Install the toolchain
              run: pip install -r requirements.txt

            - name: Build
              run: python -I tools/build.py --strict

            - name: Identify the committer
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # site/ already holds CNAME, 404.html and .nojekyll: tools/build.py copies site-root over it.
            # gh-pages is replaced wholesale, so a page removed from a project leaves the site with it.
            - name: Publish
              run: |
                  set -euo pipefail
                  root="${RUNNER_TEMP}/gh-pages"
                  if git fetch --quiet origin gh-pages 2>/dev/null; then
                    git worktree add --quiet "$root" FETCH_HEAD --detach
                  else
                    git worktree add --quiet --detach "$root"
                    git -C "$root" checkout --quiet --orphan gh-pages
                    git -C "$root" rm -rq --cached . 2>/dev/null || true
                  fi
                  find "$root" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                  cp -R site/. "$root/"
                  cd "$root"
                  git add --all
                  if git diff --cached --quiet; then
                    echo "The site is up to date."
                    exit 0
                  fi
                  git commit --quiet -m "Publish the site from ${GITHUB_SHA::7}"
                  git push --quiet origin "HEAD:gh-pages"
                  echo "Published."
