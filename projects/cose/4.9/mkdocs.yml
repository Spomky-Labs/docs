  - README.md
  - "Introduction":
      - introduction/provided-features.md
      - introduction/pre-requisite.md
      - introduction/installation.md
      - introduction/security-recommendations.md
      - introduction/contributing.md
  - "Messages, structures and headers":
      - messages/README.md
      - messages/cryptographic-structures.md
      - messages/reading-headers.md
      - messages/common-header-parameters.md
      - messages/detached-content.md
      - messages/external-additional-authenticated-data.md
  - "Signing and verifying":
      - signing/README.md
      - signing/cose-sign1.md
      - signing/what-the-application-must-check.md
      - signing/cose-sign.md
      - signing/the-verification-contract.md
      - signing/verifying-with-a-certificate.md
      - signing/countersignatures.md
  - "Message authentication codes":
      - mac/README.md
      - mac/cose-mac0.md
      - mac/cose-mac.md
      - mac/the-tag-covers-the-mac-structure.md
  - "Encryption":
      - encryption/README.md
      - encryption/cose-encrypt0.md
      - encryption/cose-encrypt.md
      - encryption/the-nonce.md
  - "Key management":
      - key-management/README.md
      - key-management/the-two-sides-of-an-algorithm.md
      - key-management/what-each-family-enforces.md
      - key-management/the-kdf-context.md
      - key-management/key-restrictions.md
  - "Keys":
      - keys/README.md
      - keys/key-parameter-forms.md
      - keys/ed25519-private-keys.md
      - keys/key-restrictions.md
      - keys/validating-rsa-keys.md
      - keys/validating-symmetric-keys.md
      - keys/key-thumbprints.md
      - keys/loading-a-key-from-a-certificate.md
  - "Algorithms":
      - algorithms/README.md
      - algorithms/signature-algorithms.md
      - algorithms/ml-dsa.md
      - algorithms/insecure-algorithms.md
      - algorithms/mac-algorithms.md
      - algorithms/content-encryption-algorithms.md
      - algorithms/key-management-algorithms.md
      - algorithms/hash-algorithms.md
      - algorithms/registering-algorithms.md
  - "Header parameters and profiles":
      - header-parameters/cwt.md
      - header-parameters/x509.md
      - header-parameters/hash-envelope.md
      - header-parameters/receipts.md
      - header-parameters/timestamp-tokens.md
  - "Migration":
      - migration/upgrading.md
