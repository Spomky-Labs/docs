site_name: Access Control Framework
site_description: Authorization for PHP applications. Voters, combining algorithms, access policies declared as attributes and decisions that say why they were reached.
site_url: https://docs.spomky-labs.com/acf/1.0/
site_author: Spomky-Labs
repo_url: https://github.com/Spomky-Labs/access-control-framework
repo_name: spomky-labs/access-control-framework
edit_uri: https://github.com/Spomky-Labs/docs/edit/main/projects/acf/1.0/docs/

docs_dir: docs
site_dir: site


theme:
  name: material
  custom_dir: overrides
  language: en
  # Space Grotesk and IBM Plex Mono are served from assets/fonts, declared in slabs.css: the theme loads
  # no font of its own.
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    annotation: material/plus-circle
  favicon: assets/brand/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the light theme
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

# The tokens of the Slabs design kit, as they are, then the rules that apply them.
extra_css:
  - assets/stylesheets/slabs-tokens.css
  - assets/stylesheets/slabs.css

plugins:
  - search
  # Every asset is served from this site. Should a page ever reference an external one, it is downloaded
  # at build time: nothing a reader loads reaches a third party.
  - privacy
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      fallback_to_build_date: true
  # The GitBook space published the pages of the bundle under the-symfony-bundle/, the directory is
  # symfony-bundle/. Those addresses are linked from elsewhere and keep leading to their page.
  - redirects:
      redirect_maps:
        the-symfony-bundle/installation.md: symfony-bundle/installation.md
        the-symfony-bundle/configuration.md: symfony-bundle/configuration.md
        the-symfony-bundle/controllers.md: symfony-bundle/controllers.md
        the-symfony-bundle/url-rules.md: symfony-bundle/url-rules.md
        the-symfony-bundle/templates.md: symfony-bundle/templates.md
        the-symfony-bundle/console.md: symfony-bundle/console.md
        the-symfony-bundle/workflow.md: symfony-bundle/workflow.md
        the-symfony-bundle/profiler.md: symfony-bundle/profiler.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      title: On this page
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      # A PHP block of these pages starts without "<?php", which Pygments needs before it colours anything,
      # and which GitBook never asked for.
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
      line_spans: __span
      # The number of a line is written at the start of the line itself, so it cannot drift from it.
      linenums_style: pymdownx-inline
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tilde

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn

extra:
  status:
    draft: This page is a stub, the section it belongs to is not written yet
    new: Added in this version
  version:
    provider: mike
    alias: true
    default: latest
  # The footer of the Slabs guidelines (p. 31): links in Calcaire, then the legal line in Béton.
  slabs:
    website: https://spomky-labs.com/
    links:
      - name: All documentation
        link: https://docs.spomky-labs.com/
      - name: Access Control Framework on GitHub
        link: https://github.com/Spomky-Labs/access-control-framework
      - name: Packagist
        link: https://packagist.org/packages/spomky-labs/
      - name: Security
        link: https://github.com/Spomky-Labs/access-control-framework/security/policy
      - name: Sponsor
        link: https://github.com/sponsors/Spomky
    legal: SPOMKY-LABS · Florent Morselli EI
    # The legal notice, the privacy policy and the contact page are shared by every documentation site,
    # on the central one.
    legal_links:
      - name: Legal notice
        link: https://docs.spomky-labs.com/legal-notice/
      - name: Privacy
        link: https://docs.spomky-labs.com/privacy/
      - name: Contact
        link: https://docs.spomky-labs.com/contact/

# The title of each page is its first heading.
nav:
  - README.md
  - The project:
      - the-project/the-project.md
      - the-project/installation.md
      - the-project/contributing.md
  - Access Control in a nutshell:
      - access-control-in-a-nutshell/vocabulary.md
      - access-control-in-a-nutshell/voters.md
      - access-control-in-a-nutshell/combining-algorithms.md
      - access-control-in-a-nutshell/requesters.md
  - Pure PHP:
      - pure-php/the-manager.md
      - pure-php/access-policies.md
      - pure-php/testing.md
  - The Symfony bundle:
      - symfony-bundle/installation.md
      - symfony-bundle/configuration.md
      - symfony-bundle/controllers.md
      - symfony-bundle/url-rules.md
      - symfony-bundle/templates.md
      - symfony-bundle/console.md
      - symfony-bundle/workflow.md
      - symfony-bundle/profiler.md
  - Migration:
      - migration/the-two-migrations.md
      - migration/from-security.md
      - migration/known-divergences.md
