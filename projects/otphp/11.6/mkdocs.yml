site_name: OTPHP
site_description: One-time passwords for PHP. Time-based codes (TOTP) and counter-based codes (HOTP), after RFC 6238 and RFC 4226, read by Google Authenticator and the other authenticator applications.
site_url: https://docs.spomky-labs.com/otphp/11.6/
site_author: Spomky-Labs
repo_url: https://github.com/Spomky-Labs/otphp
repo_name: spomky-labs/otphp
edit_uri: https://github.com/Spomky-Labs/docs/edit/main/projects/otphp/11.6/docs/

docs_dir: docs
site_dir: site



theme:
  name: material
  custom_dir: overrides
  language: en
  # Space Grotesk and IBM Plex Mono are served from assets/fonts, declared in slabs.css: the theme loads
  # no font of its own.
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    annotation: material/plus-circle
  favicon: assets/brand/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the light theme
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

# The tokens of the Slabs design kit, as they are, then the rules that apply them.
extra_css:
  - assets/stylesheets/slabs-tokens.css
  - assets/stylesheets/slabs.css

plugins:
  - search
  # Every asset is served from this site. Should a page ever reference an external one, it is downloaded
  # at build time: nothing a reader loads reaches a third party.
  - privacy
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      title: On this page
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      # A PHP block of these pages starts without "<?php", which Pygments needs before it colours anything.
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
      line_spans: __span
      # The number of a line is written at the start of the line itself, so it cannot drift from it.
      linenums_style: pymdownx-inline
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tilde

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn

extra:
  status:
    draft: This page is a stub, the section it belongs to is not written yet
    new: Added in this version
  version:
    provider: mike
    alias: true
    default: latest
  # The footer of the Slabs guidelines (p. 31): links in Calcaire, then the legal line in Béton.
  slabs:
    website: https://spomky-labs.com/
    links:
      - name: All documentation
        link: https://docs.spomky-labs.com/
      - name: OTPHP on GitHub
        link: https://github.com/Spomky-Labs/otphp
      - name: Packagist
        link: https://packagist.org/packages/spomky-labs/otphp
      - name: Security
        link: https://github.com/Spomky-Labs/otphp/security/policy
      - name: Sponsor
        link: https://github.com/sponsors/Spomky
    legal: SPOMKY-LABS · Florent Morselli EI
    # The legal notice, the privacy policy and the contact page are shared by every documentation site,
    # on the central one.
    legal_links:
      - name: Legal notice
        link: https://docs.spomky-labs.com/legal-notice/
      - name: Privacy
        link: https://docs.spomky-labs.com/privacy/
      - name: Contact
        link: https://docs.spomky-labs.com/contact/

# The title of each page is its first heading.
nav:
  - README.md
  - "The project":
      - the-project/the-project.md
      - the-project/installation.md
      - the-project/security-recommendations.md
      - the-project/the-release-process.md
      - the-project/contributing.md
      - the-project/license.md
  - "One-time passwords":
      - one-time-passwords/totp-or-hotp.md
      - one-time-passwords/creating-an-otp.md
      - one-time-passwords/generating-a-password.md
      - one-time-passwords/verifying-a-password.md
      - one-time-passwords/the-window.md
      - one-time-passwords/the-clock.md
  - "The parameters":
      - the-parameters/the-parameters.md
      - the-parameters/the-secret.md
      - the-parameters/the-digest-and-the-digits.md
      - the-parameters/the-period-and-the-epoch.md
      - the-parameters/the-counter.md
      - the-parameters/the-label-and-the-issuer.md
      - the-parameters/custom-parameters.md
  - "Configuring an application":
      - configuring-an-application/the-provisioning-uri.md
      - configuring-an-application/qr-codes.md
      - configuring-an-application/the-factory.md
      - configuring-an-application/authenticator-applications.md
  - "In your application":
      - in-your-application/what-to-store.md
      - in-your-application/exceptions.md
      - in-your-application/questions-and-answers.md
  - "Migration":
      - migration/from-v8.3-to-v9.md
      - migration/from-v9-to-v10.md
      - migration/from-v10-to-v11.md
      - migration/from-v11-to-v12.md
